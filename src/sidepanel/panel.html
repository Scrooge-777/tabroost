<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Workspaces</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="panel-container">
    <!-- Top Header -->
    <header class="panel-header">
      <div class="header-brand">
        <svg class="brand-icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="4.5" width="11" height="11" rx="2.5" fill="currentColor" fill-opacity="0.15"/>
          <path d="M6.5 4.5V3a1.5 1.5 0 0 1 1.5-1.5h7.5A1.5 1.5 0 0 1 17 3v7.5a1.5 1.5 0 0 1-1.5 1.5h-1.5"/>
          <line x1="2.5" y1="8" x2="13.5" y2="8"/>
        </svg>
        <h1 class="brand-title">Workspaces</h1>
      </div>
      <div class="header-actions">
        <button id="btn-dock-sidepanel" class="header-btn icon-btn" title="Open in Side Panel">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <rect x="2" y="2" width="12" height="12" rx="2"/>
            <line x1="10" y1="2" x2="10" y2="14"/>
          </svg>
        </button>
        <button id="btn-open-options" class="header-btn icon-btn" title="Settings">
          <svg viewBox="0 0 512 512" width="15" height="15" fill="currentColor" fill-rule="evenodd" aria-hidden="true">
            <path d="M 243 8 L 222 10 L 213 12 L 202 18 L 195 25 L 191 32 L 188 42 L 188 54 L 185 66 L 178 79 L 167 90 L 161 94 L 152 98 L 143 100 L 128 100 L 117 97 L 112 95 L 106 91 L 96 88 L 85 88 L 75 91 L 67 96 L 61 102 L 50 117 L 39 135 L 26 162 L 23 173 L 23 183 L 25 191 L 30 200 L 38 208 L 48 214 L 57 223 L 61 229 L 65 237 L 68 249 L 68 262 L 65 274 L 57 288 L 48 297 L 38 303 L 30 311 L 28 314 L 24 323 L 23 328 L 23 338 L 24 343 L 29 356 L 43 383 L 50 394 L 61 409 L 71 418 L 75 420 L 85 423 L 96 423 L 106 420 L 112 416 L 117 414 L 128 411 L 143 411 L 152 413 L 157 415 L 167 421 L 178 432 L 185 445 L 187 451 L 188 457 L 188 469 L 190 477 L 195 486 L 202 493 L 210 498 L 222 501 L 243 503 L 268 503 L 289 501 L 298 499 L 309 493 L 316 486 L 322 474 L 323 469 L 323 457 L 326 445 L 333 432 L 344 421 L 350 417 L 359 413 L 368 411 L 383 411 L 394 414 L 399 416 L 405 420 L 415 423 L 426 423 L 436 420 L 444 415 L 450 409 L 461 394 L 472 376 L 485 349 L 488 338 L 488 328 L 486 320 L 481 311 L 473 303 L 463 297 L 454 288 L 450 282 L 446 274 L 443 262 L 443 249 L 446 237 L 451 227 L 454 223 L 463 214 L 473 208 L 481 200 L 483 197 L 487 188 L 488 183 L 488 173 L 487 168 L 482 155 L 468 128 L 461 117 L 450 102 L 440 93 L 436 91 L 426 88 L 415 88 L 405 91 L 399 95 L 394 97 L 383 100 L 368 100 L 359 98 L 354 96 L 344 90 L 333 79 L 326 66 L 323 54 L 323 42 L 321 34 L 316 25 L 308 17 L 301 13 L 289 10 L 268 8 Z M 252 181 L 268 182 L 282 186 L 294 192 L 305 200 L 315 211 L 322 222 L 327 235 L 329 243 L 330 253 L 329 268 L 325 282 L 319 294 L 311 305 L 300 315 L 287 323 L 273 328 L 260 330 L 251 330 L 243 329 L 229 325 L 217 319 L 211 315 L 206 310 L 205 310 L 196 300 L 188 287 L 184 276 L 182 268 L 182 260 L 181 259 L 182 243 L 186 229 L 192 217 L 200 206 L 211 196 L 224 188 L 235 184 L 243 182 L 251 182 Z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Mode Switcher: Workspaces vs Open Tabs -->
    <nav class="view-nav-segment" role="tablist">
      <button id="nav-btn-workspaces" class="view-nav-btn active" role="tab" aria-selected="true" type="button">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="9" height="9" rx="1.8" fill="currentColor" fill-opacity="0.15"/>
          <path d="M5.5 4V2.2A1.2 1.2 0 0 1 6.7 1h6.1A1.2 1.2 0 0 1 14 2.2v6.1a1.2 1.2 0 0 1-1.2 1.2h-1.8"/>
          <line x1="2" y1="6.8" x2="11" y2="6.8"/>
        </svg>
        <span>Workspaces</span>
      </button>
      <button id="nav-btn-open-tabs" class="view-nav-btn" role="tab" aria-selected="false" type="button">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4.5" width="12" height="9.5" rx="1.8" fill="currentColor" fill-opacity="0.15"/>
          <path d="M4.5 4.5V2.8a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v1.7"/>
          <line x1="8" y1="7.2" x2="8" y2="11.2"/>
          <line x1="6" y1="9.2" x2="10" y2="9.2"/>
        </svg>
        <span id="nav-open-tabs-count">Open Tabs</span>
      </button>
    </nav>

    <!-- Search Section -->
    <div id="search-section" class="search-section">
      <div class="search-input-wrapper">
        <svg class="search-icon" width="13" height="13" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
        </svg>
        <input type="search" id="workspace-search" placeholder="Search workspaces..." autocomplete="off">
      </div>
    </div>

    <!-- Main Workspace List -->
    <main id="workspace-list" class="workspace-list" role="list">
      <!-- Dynamically rendered workspace cards -->
      <div class="loading-spinner">Loading workspaces...</div>
    </main>

    <!-- Live Open Tabs List View (Drag-to-group surface) -->
    <section id="window-tabs-section" class="window-tabs-section hidden" aria-label="Open tabs in this window">
      <div class="window-tabs-tip">
        <span class="tip-text">Drag tab over tab to group</span>
      </div>
      <div id="window-tabs-list" class="window-tabs-list" role="list">
        <!-- Live draggable tab rows rendered here -->
      </div>
    </section>

    <!-- Edge-style New Workspace Accordion -->
    <div class="new-workspace-section">
      <button id="btn-new-workspace-accordion" class="new-workspace-accordion-btn" type="button" aria-expanded="false">
        <span class="nw-btn-left">
          <span class="nw-icon-box">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M8 3v10M3 8h10" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="nw-title">New workspace</span>
        </span>
        <svg class="nw-chevron" viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M2.5 4.5L6 8L9.5 4.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div id="new-workspace-dropdown" class="new-workspace-dropdown hidden">
        <button id="btn-create-with-tabs" class="nw-sub-btn" type="button">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" class="sub-btn-icon" aria-hidden="true">
            <path d="M2 3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3zm1 2v8h10V5H3zm0-1h10V3H3v1z"/>
          </svg>
          <span id="lbl-create-with-tabs" class="sub-btn-label">Create workspace with tabs</span>
        </button>
        <button id="btn-create-blank" class="nw-sub-btn" type="button">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" class="sub-btn-icon" aria-hidden="true">
            <rect x="2" y="2" width="12" height="12" rx="2"/>
            <path d="M8 5v6M5 8h6" stroke-linecap="round"/>
          </svg>
          <span class="sub-btn-label">Create blank workspace</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal: New Workspace -->
  <div id="modal-new-workspace" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2>New Workspace</h2>
        <button class="modal-close-btn" data-modal="modal-new-workspace">&times;</button>
      </div>
      <form id="form-new-workspace">
        <div class="form-group">
          <label for="new-ws-name">Workspace Name</label>
          <input type="text" id="new-ws-name" placeholder="e.g. Research, Project, Finance" required>
        </div>
        <div class="form-group">
          <label>Accent Color</label>
          <div id="new-ws-color-container"></div>
        </div>
        <div class="form-group-checkbox">
          <label>
            <input type="checkbox" id="new-ws-from-current">
            <span>Include all tabs from this window</span>
          </label>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" data-modal="modal-new-workspace">Cancel</button>
          <button type="submit" class="btn primary">Create Workspace</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Edit Workspace -->
  <div id="modal-rename-workspace" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Edit Workspace</h2>
        <button class="modal-close-btn" data-modal="modal-rename-workspace">&times;</button>
      </div>
      <form id="form-rename-workspace">
        <input type="hidden" id="rename-ws-id">
        <div class="form-group">
          <label for="rename-ws-name">Workspace Name</label>
          <input type="text" id="rename-ws-name" required>
        </div>
        <div class="form-group">
          <label>Accent Color</label>
          <div id="edit-ws-color-container"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" data-modal="modal-rename-workspace">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Confirm Delete -->
  <div id="modal-delete-workspace" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Delete Workspace?</h2>
        <button class="modal-close-btn" data-modal="modal-delete-workspace">&times;</button>
      </div>
      <p id="delete-prompt-text" class="modal-description">
        Are you sure you want to delete this workspace? Its open window will stay open as unmanaged.
      </p>
      <div class="form-group-checkbox">
        <label>
          <input type="checkbox" id="delete-dont-ask-again">
          <span>Don't ask again</span>
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" data-modal="modal-delete-workspace">Cancel</button>
        <button type="button" id="btn-confirm-delete" class="btn danger">Delete</button>
      </div>
    </div>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
