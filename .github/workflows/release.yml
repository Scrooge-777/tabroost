name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag must match manifest version
        run: |
          test "v$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm run pack
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prefer the matching CHANGELOG section as release notes; fall back to auto-generated notes.
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > release-notes.md
          if grep -q '[^[:space:]]' release-notes.md; then
            gh release create "${GITHUB_REF_NAME}" dist/*.zip --notes-file release-notes.md --title "Tabroost ${GITHUB_REF_NAME}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip --generate-notes --title "Tabroost ${GITHUB_REF_NAME}"
          fi
