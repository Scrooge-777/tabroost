name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tag must match manifest version
        run: |
          test "v$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm run pack
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip --generate-notes --title "Tabroost ${GITHUB_REF_NAME}"
