name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - run: npm run lint
      - run: npm run coverage
      - run: npm audit --audit-level=high

  browser:
    # Experimental: loads the unpacked extension in Chromium. Not required to pass yet.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright-core@1.58.2
      - run: npx playwright-core install --with-deps chromium
      - name: Extension smoke tests
        run: |
          export PLAYWRIGHT=$(node -p "require.resolve('playwright-core')")
          export BROWSER=$(node -p "require('playwright-core').chromium.executablePath()")
          xvfb-run -a npm run test:browser
          xvfb-run -a npm run test:page
